    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            color: #333;
            line-height: 1.6;
            background-color: #f9f9f9;
        }
        header {
            background-color: #ff0000;
            color: #fff;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
        }
        .hero {
            background-color: #cccccc;
            color: #fff;
            text-align: center;
            padding: 80px 20px;
        }
        .hero h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ecc94b;
            color: #1a365d;
            padding: 12px 24px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            color: #1a365d;
        }
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .course-card {
            background: #444444;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .course-card h3 {
            color: #ff0000;
            margin-bottom: 10px;
        }
        footer {
            background-color: #ff0000;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 11px;
        }
